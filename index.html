<body>

  <main id="top">
    <!-- =========================================================
         [A] HERO
         ========================================================= -->
    <section class="hero" id="hero">
      <div class="container hero-grid">
        <div class="hero-copy">
          <h1 class="hero-headline" data-i18n="hero.headline"></h1>
          <p class="hero-sub" data-i18n="hero.sub"></p>

          <!-- On mobile this button scrolls to the form (which sits below).
               On desktop the form is already visible to the right. -->
          <a href="#lead-form" class="btn btn-accent btn-block hero-cta-mobile" data-scroll>
            <span data-i18n="cta.primary"></span>
          </a>

          <ul class="hero-bullets" data-i18n-attr="aria-label:hero.bulletsAria">

            <li data-i18n="hero.bullet2"></li>
            <li data-i18n="hero.bullet3"></li>
          </ul>
        </div>

        <!-- ===================== LEAD FORM (single source of truth) ===================== -->
        <div class="hero-form-wrap" id="lead-form">
          <div class="form-card">
            <h2 class="form-title" data-i18n="form.title"></h2>
            <p class="form-subtitle" data-i18n="form.subtitle"></p>

            <!--
              MAILCHIMP INTEGRATION
              =====================
              Submitted in the background (JSONP) so the visitor never leaves
              the page and we control the success state. Same wiring as the
              Colorado and David templates — see README.md.

              >>> REPLACE THESE PLACEHOLDERS BEFORE GOING LIVE <<<
                action                   : Christina's Mailchimp form-action URL
                input name="b_XXXX_YYYY" : the honeypot field name from her embed code

              Field "name" attributes below (EMAIL, FNAME, PHONE, ADDRESS,
              SITUATION, TCPA_CONSENT) are Mailchimp MERGE TAGS. Create them in
              Audience → Settings → Audience fields. ADDRESS must be a TEXT
              field, never Mailchimp's native "Address" type.
            -->
            <form
              id="rental-form"
              novalidate
              action="https://YOUR_DC.list-manage.com/subscribe/post-json?u=PLACEHOLDER_U&id=PLACEHOLDER_ID&c=?"
              method="get"
            >
              <!-- Honeypot (anti-bot). Mailchimp expects this; keep it visually hidden. -->
              <div aria-hidden="true" class="hp-field">
                <label>Leave this field empty
                  <input type="text" name="b_PLACEHOLDER_U_PLACEHOLDER_ID" tabindex="-1" value="" autocomplete="off" />
                </label>
              </div>

              <div class="field">
                <label for="f-name" data-i18n="form.name"></label>
                <input type="text" id="f-name" name="FNAME" autocomplete="name" required />
                <small class="field-error" data-error-for="f-name"></small>
              </div>

              <div class="field">
                <label for="f-email" data-i18n="form.email"></label>
                <input type="email" id="f-email" name="EMAIL" autocomplete="email" inputmode="email" required />
                <small class="field-error" data-error-for="f-email"></small>
              </div>

              <div class="field">
                <label for="f-phone" data-i18n="form.phone"></label>
                <input type="tel" id="f-phone" name="PHONE" autocomplete="tel" inputmode="tel" required />
                <small class="field-error" data-error-for="f-phone"></small>
              </div>

              <div class="field">
                <label for="f-address" data-i18n="form.address"></label>
                <input type="text" id="f-address" name="ADDRESS" autocomplete="street-address" required />
                <small class="field-error" data-error-for="f-address"></small>
              </div>

              <div class="field">
                <label for="f-situation" data-i18n="form.situation"></label>
                <!--
                  SITUATION dropdown. The VALUES (not the labels) are what
                  Mailchimp stores and what the follow-up journeys branch on —
                  they stay in English in both languages on purpose, so the
                  automation has one set of conditions, not two.
                  ⚠ The field is optional, so it CAN arrive empty. Empty must
                  route to the nurture track or that lead gets nothing.
                  See SECUENCIA-02-lisa-rental.md in realtors-san-diego\.
                -->
                <select id="f-situation" name="SITUATION">
                  <option value="" data-i18n="form.situation.placeholder"></option>
                  <option value="Relocating" data-i18n="form.situation.opt1"></option>
                  <option value="Inherited" data-i18n="form.situation.opt2"></option>
                  <option value="Investment" data-i18n="form.situation.opt3"></option>
                  <option value="Deciding to sell" data-i18n="form.situation.opt4"></option>
                  <option value="Other" data-i18n="form.situation.opt5"></option>
                </select>
              </div>

              <!--
                TCPA CONSENT (required — California). Required checkbox with its
                own validator; the form will not submit without it. Map
                TCPA_CONSENT to a Mailchimp merge field if you want the consent
                timestamped on the contact record.
              -->
              <div class="consent-field">
                <input type="checkbox" id="f-consent" name="TCPA_CONSENT" value="yes" required />
                <label for="f-consent" data-i18n="form.consent"></label>
              </div>
              <small class="field-error" data-error-for="f-consent"></small>

              <button type="submit" class="btn btn-accent btn-block btn-submit">
                <span class="btn-label" data-i18n="cta.primary"></span>
                <span class="btn-spinner" aria-hidden="true"></span>
              </button>

              <p class="form-reassure" data-i18n="form.reassure"></p>
              <p class="form-feedback" id="form-feedback" role="alert" aria-live="assertive"></p>
            </form>

            <!-- Success state (revealed in place after submit) -->
            <div class="form-success" id="form-success" hidden>
              <div class="form-success-check" aria-hidden="true">✓</div>
              <h3 data-i18n="success.title"></h3>
              <p data-i18n="success.body"></p>
              <a href="#" class="btn btn-outline btn-block" data-contact-link="phone">
                <span data-i18n="success.call"></span> <span data-contact="phone"></span>
              </a>
            </div>
          </div>
        </div>
      </div>
